name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Le contrôle HACS évolue avec le temps : une passe hebdomadaire évite
    # de découvrir un dépôt invalide le jour d'une release.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: test -s dist/acd-cards.js

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hacs/action@main
        with:
          category: plugin
